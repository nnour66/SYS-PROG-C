stages:
  - build
  - test

image: registry.app.unistra.fr/montavont/img-docker/progsys:latest

build_2.5:
  stage: build
  script:
    - cd 02-repertoires/05-cacher-fichier
    - scons
  artifacts:
    paths:
      - 02-repertoires/05-cacher-fichier/cacher

# run tests using the binary build before
test_2.5:
  stage: test
  needs: [build_2.5]
  script:
  - |
    echo "starting test"
    cd 02-repertoires/05-cacher-fichier
    ./tests.sh
